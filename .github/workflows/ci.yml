name: CI

on:
  push: {}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: chordrift_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chordrift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHORDRIFT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chordrift_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: node --check web/app.js && node --check web/maintenance-decisions.js && node --check web/library-explorer.js
      - run: node tests/web_maintenance_decisions.mjs && node tests/web_library_explorer.mjs
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo test --test postgres_integration -- --ignored
      - run: cargo test --lib spotify_persistence_round_trip -- --ignored
      - run: cargo package
